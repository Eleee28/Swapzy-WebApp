<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapzy - Main Page</title>
    <link rel="stylesheet" href="css/user.css">

    <!-- Leaflet.js for maps API -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
</head>
<body>
    <!-- Header Section-->
    <header class="header">
        <!-- Logo Container-->
        <a href="/" class="logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="logo">
            <span class="logo-text">SWAPZY</span> 
        </a>

        <!-- Navigation Buttons -->
        <nav class="nav-buttons">
            <a class="nav-btn" id="fav-button">
                <img src="images/heart.png">
                <span class="btn-text">Favorites</span>
            </a>
            <div class="profile-dropdown-container" id="profile-dropdown-container">
                <a class="nav-btn" id="profile-button">
                    <img src="images/profile.png" alt="Profile Icon">
                    <span class="btn-text">Profile</span>
                </a>
            </div>
            <a class="nav-btn" id="sell-button">
                <img src="images/sell.png" alt="Sell Icon">
                <span class="btn-text">Sell</span>
            </a>
        </nav>
    </header>

    <!-- Categories Navbar -->
    <nav class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Categories</button>
            <div class="dropdown-content" id="category-list">
                <!-- Dynamic categories from backend will be loaded here -->
            </div>
        </div>
        <!-- Static Links to Categories -->
        <div class="static-links"></div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="profile-card">
            <!-- Profile Picture and Name -->
            <div class="profile-header">
                <img src="images/profile_picture_sample.jpg" alt="Profile Picture" class="profile-picture" id="profile-pic">
                <h2 class="profile-name" id="profile-name">User Name</h2>
            </div>
    
            <!-- Contact Details -->
            <div class="contact-details">
                <h3>Contact Details</h3>
                <p id="profile-email">user@example.com</p>
            </div>
    
            <!-- Location -->
            <div class="location-details">
                <h3>Location</h3>
                <div class="location-map">
                    <div id="map" style="height: 400px; width: 100%;"></div>
                </div>
            </div>
        </div>
        <!-- User's Products -->
        <div class="search-results-section">
            <h2 class="section-title">Products</h2>
            <div class="results-container">
                <div class="results-track"></div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="footer-logo">
            <span class="footer-logo-text">SWAPZY</span>
        </div>

        <!-- Footer info here -->

    </footer>

    <script src="javascript/nav-bar.js"></script>
    <script src="javascript/user.js"></script>
    <script src="javascript/session-expiry.js"></script>

</body>
</html>
