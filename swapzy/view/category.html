<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapzy - Main Page</title>
    <link rel="stylesheet" href="css/category.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- Leaflet.js for maps API -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
</head>
<body>
    <!-- Header Section-->
    <header class="header">
        <!-- Logo Container-->
        <a href="/" class="logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="logo">
            <span class="logo-text">SWAPZY</span> 
        </a>

        <!-- Navigation Buttons -->
        <nav class="nav-buttons">
            <a class="nav-btn" id="fav-button">
                <img src="images/heart.png">
                <span class="btn-text">Favorites</span>
            </a>
            <div class="profile-dropdown-container" id="profile-dropdown-container">
                <a class="nav-btn" id="profile-button">
                    <img src="images/profile.png" alt="Profile Icon">
                    <span class="btn-text">Profile</span>
                </a>
            </div>
            <a class="nav-btn" id="sell-button">
                <img src="images/sell.png" alt="Sell Icon">
                <span class="btn-text">Sell</span>
            </a>
        </nav>
    </header>

    <!-- Categories Navbar -->
    <nav class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Categories</button>
            <div class="dropdown-content" id="category-list">
                <!-- Dynamic categories from backend will be loaded here -->
            </div>
        </div>
        <!-- Static Links to Categories -->
        <div class="static-links"></div>
    </nav>

    <!-- Filters Bar -->
    <nav class="filters-bar">
        <div class="filter-dropdown">
            <div class="filter-icon">
                <img src="images/filter_icon.png" alt="Filter Icon">
            </div>
            <!-- Location Dropdown -->
            <div class="dropdown1">
                <button class="dropbtn1">Location</button>
                <div class="dropdown1-content location-dropdown">
                    <input type="text" placeholder="Search Location" class="location-search-input" id="location-search-input">
                    <div class="location-map">
                        <div class="map" id="map"></div>
                    </div>
                </div>
            </div>
            <!-- Price Dropdown -->
            <div class="dropdown1">
                <button class="dropbtn1">Price</button>
                <div class="dropdown1-content price-dropdown">
                    <p>How much do you want to pay?</p>
                    <input type="range" min="0" max="20000" value="20000" class="price-slider" id="price-slider">
                    <div class="price-label" id="price-label">20000</div>
                </div>
            </div>
            <!-- Product Status Dropdown -->
            <div class="dropdown1">
                <button class="dropbtn1">Product Status</button>
                <div class="dropdown1-content product-status-dropdown" id="state-options">
                </div>
            </div>
            <!-- Clean Filters Button -->
            <button class="cleanbtn">Clean Filters</button>
        </div>
        <div class="sort-dropdown">
            <!-- <div class="sort-icon">
                <img src="images/sort_icon.png" alt="Sort Icon">
            </div> -->
            <!-- Price Sorting Dropdown -->
            <div class="dropdown1">
                <span id="sort-text">Sort by: Price </span>
                <div class="dropdown1-content price-sorting-dropdown">
                    <a href="#" class="sort-option" data-sort="low-to-high">Low to High</a>
                    <a href="#" class="sort-option" data-sort="high-to-low">High to Low</a>
                </div>
                <!-- <button class="dropbtn1">Sort by Price</button>
                <div class="dropdown1-content price-sorting-dropdown">
                    <a href="#" class="sort-option dropdown-item d-flex align-items-center" data-sort="price-asc">Low to High</a>
                    <a href="#" class="sort-option dropdown-item d-flex align-items-center" data-sort="price-desc">High to Low</a>
                </div> -->
            </div>
            <!-- Clean Sorting Button -->
            <!-- <button class="clean-sorting-btn">Clean Sorting</button> -->
        </div>
        
    </nav>
    <!-- Main Content -->
    <div class="main-content">
        <!-- Category Header Section -->
        <div class="category-header">
            <h1 class="title" id="category-title">Category Name</h1>
        </div>
        <div class="product-list">
            <div class="product-card">
                <div class="product-image">
                    <img src="images/product_sample.jpeg" alt="Product Image">
                </div>
                <div class="product-info">
                    <div class="product-name-and-like">
                        <h3 class="product-title">Product Name</h3>
                        <!-- Like Button -->
                        <!-- From Uiverse.io by catraco https://uiverse.io/catraco/perfect-panda-49 --> 
                        <div title="Like" class="heart-container">
                            <input id="Give-It-An-Id" class="checkbox" type="checkbox">
                            <div class="svg-container">
                                <svg xmlns="http://www.w3.org/2000/svg" class="svg-outline" viewBox="0 0 24 24">
                                    <path d="M17.5,1.917a6.4,6.4,0,0,0-5.5,3.3,6.4,6.4,0,0,0-5.5-3.3A6.8,6.8,0,0,0,0,8.967c0,4.547,4.786,9.513,8.8,12.88a4.974,4.974,0,0,0,6.4,0C19.214,18.48,24,13.514,24,8.967A6.8,6.8,0,0,0,17.5,1.917Zm-3.585,18.4a2.973,2.973,0,0,1-3.83,0C4.947,16.006,2,11.87,2,8.967a4.8,4.8,0,0,1,4.5-5.05A4.8,4.8,0,0,1,11,8.967a1,1,0,0,0,2,0,4.8,4.8,0,0,1,4.5-5.05A4.8,4.8,0,0,1,22,8.967C22,11.87,19.053,16.006,13.915,20.313Z"></path>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" class="svg-filled" viewBox="0 0 24 24">
                                    <path d="M17.5,1.917a6.4,6.4,0,0,0-5.5,3.3,6.4,6.4,0,0,0-5.5-3.3A6.8,6.8,0,0,0,0,8.967c0,4.547,4.786,9.513,8.8,12.88a4.974,4.974,0,0,0,6.4,0C19.214,18.48,24,13.514,24,8.967A6.8,6.8,0,0,0,17.5,1.917Z"></path>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" height="100" width="100" class="svg-celebrate">
                                    <polygon points="10,10 20,20"></polygon>
                                    <polygon points="10,50 20,50"></polygon>
                                    <polygon points="20,80 30,70"></polygon>
                                    <polygon points="90,10 80,20"></polygon>
                                    <polygon points="90,50 80,50"></polygon>
                                    <polygon points="80,80 70,70"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <p class="product-price">100€</p>
                    <p class="product-status"> Like New</p>
                    <p class="product-description">Short decription of the product</p>
                </div>

            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="footer-logo">
            <span class="footer-logo-text">SWAPZY</span>
        </div>

        <!-- Footer info here -->

    </footer>

    <script src="javascript/nav-bar.js"></script>
    <script src="javascript/category.js"></script>
    <script src="javascript/session-expiry.js"></script>

</body>
</html>
