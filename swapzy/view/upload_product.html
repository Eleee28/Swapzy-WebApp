<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapzy - Main Page</title>
    <link rel="stylesheet" href="css/upload_product.css">

</head>
<body>
    <!-- Header Section-->
    <header class="header">
        <!-- Logo Container-->
        <a href="main.html" class="logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="logo">
            <span class="logo-text">SWAPZY</span> 
        </a>

        <!-- Search Input with Icon and Button -->
        <!-- From Uiverse.io by garerim https://uiverse.io/garerim/rare-moth-56 -->
        <div class="container-input">
            <input type="text" name="text" class="input">
            <svg fill="#000000" width="20px" height="20px" viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg">
                <path d="M790.588 1468.235c-373.722 0-677.647-303.924-677.647-677.647 0-373.722 303.925-677.647 677.647-677.647 373.723 0 677.647 303.925 677.647 677.647 0 373.723-303.924 677.647-677.647 677.647Zm596.781-160.715c120.396-138.692 193.807-319.285 193.807-516.932C1581.176 354.748 1226.428 0 790.588 0S0 354.748 0 790.588s354.748 790.588 790.588 790.588c197.647 0 378.24-73.411 516.932-193.807l516.028 516.142 79.963-79.963-516.142-516.028Z" fill-rule="evenodd"></path>
            </svg>
            <button class="search-btn">Search</button>
        </div>

        <!-- Navigation Buttons -->
        <nav class="nav-buttons">
            <a href="favorites.html" class="nav-btn">
                <img src="images/heart.png">
                <span class="btn-text">Favorites</span>
            </a>
            <a href="notifications.html" class="nav-btn">
                <img src="images/notification.png" alt="Notifications Icon">
                <span class="btn-text">Notifications</span>
            </a>
            <a href="profile.html" class="nav-btn">
                <img src="images/profile.png" alt="Profile Icon">
                <span class="btn-text">Profile</span>
            </a>
            <a href="sell.html" class="nav-btn">
                <img src="images/sell.png" alt="Sell Icon">
                <span class="btn-text">Sell</span>
            </a>
        </nav>
    </header>

    <!-- Categories Navbar -->
    <nav class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Categories</button>
            <div class="dropdown-content" id="category-list">
                <!-- Dynamic categories from backend will be loaded here -->
            </div>
        </div>
        <!-- Static Links to Categories -->
        <a href="#">Electronics</a>
        <a href="#">Clothing</a>
        <a href="#">Books</a>
        <a href="#">Home & Garden</a>
        <a href="#">Toys</a>
    </nav>

    <!-- Main Content -->

    <!-- Settings Header Section -->
    <div class="upload-header">
        <h1 class="title">Upload Product</h1>
    </div>

    <!-- Product Name Section -->
    <section class="product-name-section">
        <h2 class="section-title">Product Name</h2>
        <div class="product-name-container">
            <div class="input-group">
                <input type="text" id="product-name" name="product-name" placeholder="Enter product's name">
            </div>
        </div>
    </section>

    <!-- Product Category Section -->
    <section class="product-category-section">
        <h2 class="section-title">Category</h2>
        <div class="product-category-container">
            <div class="dropdown2">
                <button class="dropbtn2">Select Category</button>
                <div class="dropdown2-content">
                    <a href="#">Electronics</a>
                    <a href="#">Clothing</a>
                    <a href="#">Books</a>
                    <a href="#">Home & Garden</a>
                    <a href="#">Toys</a>
                </div>
            </div>
            
        </div>
    </section>

    <!-- Product Info Section -->
    <section class="product-info-section">
        <h2 class="section-title">Product Information</h2>
        <div class="product-info-container">

            <div class="input-group">
                <label for="product-price">Price</label>
                <input type="text" id="product-price" name="product-price" placeholder="Enter product's price">
            </div>

            <div class="input-group">
                <label for="product-description">Description</label>
                <textarea id="product-description" name="product-description" rows="5" placeholder="Enter product's description"></textarea>
            </div>

            <div class="state">
                <div class="dropdown2">
                    <label for="dropbtn2">State</label>
                    <button class="dropbtn2">Select Status</button>
                    <div class="dropdown2-content">
                        <a href="#">New</a>
                        <a href="#">Like new</a>
                        <a href="#">In good condition</a>
                        <a href="#">In acceptable condition</a>
                        <a href="#">It has given everything</a>
                    </div>
                </div> 
            </div>
                 
            <div class="input-group">
                <label for="product-photo">Photo</label>
                <input type="text" id="product-photo" name="product-photo" placeholder="Image URL">
            </div>

            <div class="input-group">
                <label for="product-location">Location</label>
                <input type="text" id="product-location" name="product-location" placeholder="Enter product's location">
            </div>
            
        </div>
    </section>

    <!-- Upload Product Button -->
    <button class="upload-button">Upload product</button>

</body>
</html>
