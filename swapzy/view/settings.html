<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapzy - Main Page</title>
    <link rel="stylesheet" href="css/settings.css">

</head>
<body>
    <!-- Header Section-->
    <header class="header">
        <!-- Logo Container-->
        <a href="/" class="logo-container">
            <img src="images/swapzy_logo.png" alt="Swapzy Logo" class="logo">
            <span class="logo-text">SWAPZY</span> 
        </a>

        <!-- Search Input with Icon and Button -->
        <!-- From Uiverse.io by garerim https://uiverse.io/garerim/rare-moth-56 -->
        <div class="container-input">
            <input type="text" name="text" class="input">
            <svg fill="#000000" width="20px" height="20px" viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg">
                <path d="M790.588 1468.235c-373.722 0-677.647-303.924-677.647-677.647 0-373.722 303.925-677.647 677.647-677.647 373.723 0 677.647 303.925 677.647 677.647 0 373.723-303.924 677.647-677.647 677.647Zm596.781-160.715c120.396-138.692 193.807-319.285 193.807-516.932C1581.176 354.748 1226.428 0 790.588 0S0 354.748 0 790.588s354.748 790.588 790.588 790.588c197.647 0 378.24-73.411 516.932-193.807l516.028 516.142 79.963-79.963-516.142-516.028Z" fill-rule="evenodd"></path>
            </svg>
            <button class="search-btn">Search</button>
        </div>

        <!-- Navigation Buttons -->
        <nav class="nav-buttons">
            <a href="favorites.html" class="nav-btn">
                <img src="images/heart.png">
                <span class="btn-text">Favorites</span>
            </a>
            <a href="profile.html" class="nav-btn">
                <img src="images/profile.png" alt="Profile Icon">
                <span class="btn-text">Profile</span>
            </a>
            <a href="sell.html" class="nav-btn">
                <img src="images/sell.png" alt="Sell Icon">
                <span class="btn-text">Sell</span>
            </a>
        </nav>
    </header>

    <!-- Categories Navbar -->
    <nav class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Categories</button>
            <div class="dropdown-content" id="category-list">
                <!-- Dynamic categories from backend will be loaded here -->
            </div>
        </div>
        <!-- Static Links to Categories -->
        <a href="#">Electronics</a>
        <a href="#">Clothing</a>
        <a href="#">Books</a>
        <a href="#">Home & Garden</a>
        <a href="#">Toys</a>
    </nav>

    <!-- Main Content -->

    <!-- Settings Header Section -->
    <div class="settings-header">
        <h1 class="title">Your Profile</h1>
        <button class="logout-button">Log Out</button>
    </div>

    <!-- Profile Pic Section -->
    <section class="profile-pic-section">
        <h2 class="section-title">Profile Pic</h2>
        <div class="profile-pic-container">
            <img src="images/profile_picture_sample.jpg" alt="Profile Picture" class="profile-pic">
            <button class="change-image-btn" onclick="openPopup()">Change Image</button>
        </div>
    </section>

    <!-- Popup for changing image -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">×</span>
            <h2>Enter Image URL</h2>
            <input type="text" placeholder="Image URL" class="url-input">
        </div>
    </div>

    <!-- Public Info Section -->
    <section class="public-info-section">
        <h2 class="section-title">Public Info</h2>
        <div class="public-info-container">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="User's username">
            </div>

            <div class="input-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="User's location">
            </div>

            <!-- Location Map -->
            <p class="location-title">Map</p>
            <div class="location-map">
                <div id="map"></div>
            </div>
        </div>
    </section>

    <!-- Account Section -->
    <section class="account-section">
        <h2 class="section-title">Account Info</h2>
        <div class="account-container">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="User's email">
            </div>
        </div>
    </section>

    <!-- Save Changes Button -->
    <button class="save-changes-button">Save Changes</button>

    <script src="javascript/settings.js"></script>

</body>
</html>
